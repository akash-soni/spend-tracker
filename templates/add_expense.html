{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}

<section class="page-section">
    <div class="container">

        <div class="page-header">
            <h1 class="page-title">Add Expense</h1>
            <p class="page-subtitle">Record a new expense to track</p>
        </div>

        <div class="form-card">
            {% if error %}
            <div class="form-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input"
                           placeholder="0.00"
                           step="0.01"
                           min="0.01"
                           value="{{ values.amount or '' }}"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="">Select a category</option>
                        <option value="Food" {% if values.category == 'Food' %}selected{% endif %}>Food</option>
                        <option value="Transport" {% if values.category == 'Transport' %}selected{% endif %}>Transport</option>
                        <option value="Bills" {% if values.category == 'Bills' %}selected{% endif %}>Bills</option>
                        <option value="Health" {% if values.category == 'Health' %}selected{% endif %}>Health</option>
                        <option value="Entertainment" {% if values.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                        <option value="Shopping" {% if values.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                        <option value="Other" {% if values.category == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ values.date or default_date }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input"
                           placeholder="What was this expense for?"
                           maxlength="200"
                           value="{{ values.description or '' }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Save Expense</button>
                    <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
